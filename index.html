
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word-Stil Schreib-App</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="ribbon">
    <div class="toolbar">
      <div class="group">
        <button onclick="format('bold')"><b>B</b></button>
        <button onclick="format('italic')"><i>I</i></button>
        <button onclick="format('underline')"><u>U</u></button>
      </div>
      <div class="group">
        <select id="fontSize">
          <option value="12px">12px</option>
          <option value="14px" selected>14px</option>
          <option value="18px">18px</option>
          <option value="24px">24px</option>
          <option value="32px">32px</option>
        </select>
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Verdana">Verdana</option>
          <option value="Courier New">Courier New</option>
        </select>
        <input type="color" id="textColorPicker"/>
      </div>
      <div class="group">
        <button onclick="undoText()">↩️</button>
        <button onclick="redoText()">↪️</button>
        <button onclick="toggleTheme()">🌗</button>
        <button onclick="exportPDF()">📄 PDF</button>
        <button onclick="downloadText()">💾 TXT</button>
        <input type="file" id="importFile" accept=".txt"/>
      </div>
    </div>
  </div>

  <div class="page-container">
    <div id="editor" contenteditable="true" class="editor" spellcheck="true">
      <p>Hier kannst du schreiben wie in Word...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
